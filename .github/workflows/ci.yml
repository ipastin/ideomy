name: CI

on:
  push:
  pull_request:

jobs:
  scaffold:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Select pnpm
        run: |
          corepack enable
          corepack install -g pnpm@12.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate:schemas
      - run: pnpm validate:contracts
      - run: pnpm validate:fixtures
      - run: pnpm check:secrets
